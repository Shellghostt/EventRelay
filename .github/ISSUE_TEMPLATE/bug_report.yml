name: Bug report
description: Something is broken or behaves differently to the plan
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include secrets, tokens or production event payloads.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: One or two sentences. What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: EventRelay version or commit
      placeholder: v0.1.0 / 9f3c2ab
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Docker 29.9.2, Go 1.23.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact anything sensitive.
      render: shell
    validations:
      required: false
