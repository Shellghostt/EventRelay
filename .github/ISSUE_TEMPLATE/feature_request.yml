name: Feature request
description: Propose a capability or a change in behaviour
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: |
        Check docs/PLAN.md first. If the feature is already scheduled, say which milestone it belongs to.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is inside the documented scope of EventRelay (see docs/PLAN.md, section 4)
          required: true
        - label: I am willing to open a pull request for this
          required: false
