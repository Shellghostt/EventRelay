# Development only. Not a production deployment reference.
name: eventrelay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eventrelay
      POSTGRES_PASSWORD: eventrelay
      POSTGRES_DB: eventrelay
    ports:
      - "${EVENTRELAY_PG_PORT:-55434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventrelay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${EVENTRELAY_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data

  api:
    build:
      context: ..
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EVENTRELAY_POSTGRES_DSN: postgresql://eventrelay:eventrelay@postgres:5432/eventrelay
      EVENTRELAY_REDIS_URL: redis://redis:6379/0
      EVENTRELAY_HTTP_ADDR: ":8080"
      EVENTRELAY_ADMIN_TOKEN: ${EVENTRELAY_ADMIN_TOKEN:-dev-admin-token-change-me}
      EVENTRELAY_TRUSTED_PROXIES: ${EVENTRELAY_TRUSTED_PROXIES:-}
    ports:
      - "${EVENTRELAY_API_PORT:-8080}:8080"

  worker:
    build:
      context: ..
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EVENTRELAY_POSTGRES_DSN: postgresql://eventrelay:eventrelay@postgres:5432/eventrelay
      EVENTRELAY_REDIS_URL: redis://redis:6379/0
      EVENTRELAY_WORKERS: ${EVENTRELAY_WORKERS:-8}
      EVENTRELAY_ALLOW_PRIVATE_TARGETS: ${EVENTRELAY_ALLOW_PRIVATE_TARGETS:-false}

volumes:
  pgdata:
  redisdata:
