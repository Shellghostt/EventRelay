openapi: 3.1.0
info:
  title: EventRelay API
  version: 0.1.0
  description: |
    Self-hosted webhook infrastructure.

    This document describes **only what is implemented**. Adding a path or a
    field before it works is treated as a documentation bug (see
    docs/PLAN.md section 20).

    Two authentication schemes exist and they are not interchangeable:
      * Management endpoints use a bearer token.
      * Ingest uses an HMAC signature over the raw request body.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Endpoints
  - name: Events
  - name: Operations

paths:
  /healthz:
    get:
      tags: [Operations]
      summary: Liveness probe
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [Operations]
      summary: Readiness probe
      description: Fails with 503 when PostgreSQL is unreachable.
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready

  /v1/endpoints:
    post:
      tags: [Endpoints]
      summary: Create a webhook endpoint
      description: |
        Returns both secrets exactly once. They cannot be retrieved later.
        `ingest_secret` verifies events sent to EventRelay;
        `delivery_secret` signs events sent to `url`.
      operationId: createEndpoint
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
      responses:
        "201":
          description: Endpoint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EndpointWithSecrets"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

    get:
      tags: [Endpoints]
      summary: List endpoints
      description: Secrets are never included in list responses.
      operationId: listEndpoints
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Endpoints for the current tenant
          content:
            application/json:
              schema:
                type: object
                required: [endpoints]
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/endpoints/{id}/events:
    post:
      tags: [Events]
      summary: Ingest a signed event
      description: |
        The signature covers the raw request body:

        ```
        signed_payload = "v1:" + timestamp + ":" + raw_body
        signature      = lower_hex(HMAC-SHA256(ingest_secret, signed_payload))
        header         = "t=" + timestamp + ",v1=" + signature
        ```

        Requests older than the configured tolerance (default 300 seconds) are
        rejected. The stored payload is `jsonb`, so key order and whitespace are
        not preserved.
      operationId: ingestEvent
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-EventRelay-Signature
          in: header
          required: true
          schema:
            type: string
          example: t=1763000000,v1=087c7bdb9ce6d9764e566fb7c4cf7e7d6a1f907e8f27205ebecc8ee406226722
        - name: X-Event-Type
          in: header
          required: false
          schema:
            type: string
            maxLength: 200
            default: event
        - name: Idempotency-Key
          in: header
          required: false
          description: Accepted but not enforced until M5.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Event accepted and stored as pending
          content:
            application/json:
              schema:
                type: object
                required: [event_id, status]
                properties:
                  event_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    const: pending
        "401":
          description: Missing, malformed, expired or mismatched signature
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Endpoint is disabled
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: Payload exceeds the configured limit
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/events:
    get:
      tags: [Events]
      summary: List events
      description: |
        Ordered by `received_at DESC, id DESC`. Pagination is cursor-based;
        pass `next_cursor` back as `cursor`. Never use an offset.
      operationId: listEvents
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_flight, delivered, dead_lettered, canceled]
        - name: endpoint_id
          in: query
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [events, next_cursor]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Static admin token from EVENTRELAY_ADMIN_TOKEN. Replaced by hashed API
        keys in M5.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Request is well formed but semantically invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem document
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

    CreateEndpointRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          example: https://example.com/webhooks/orders
        description:
          type: string
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 8

    Endpoint:
      type: object
      required: [id, url, description, enabled, max_attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        description:
          type: string
        enabled:
          type: boolean
        max_attempts:
          type: integer
        created_at:
          type: string
          format: date-time

    EndpointWithSecrets:
      allOf:
        - $ref: "#/components/schemas/Endpoint"
        - type: object
          required: [ingest_secret, delivery_secret]
          properties:
            ingest_secret:
              type: string
              description: Base64. Verifies inbound events. Returned once.
            delivery_secret:
              type: string
              description: Base64. Signs outbound delivery. Returned once.

    Event:
      type: object
      required: [id, endpoint_id, event_type, payload, status, attempt_count, received_at]
      properties:
        id:
          type: string
          format: uuid
          description: Stable for the life of the event, including replays.
        endpoint_id:
          type: string
          format: uuid
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, in_flight, delivered, dead_lettered, canceled]
        attempt_count:
          type: integer
        replay_count:
          type: integer
        next_attempt_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        delivered_at:
          type: string
          format: date-time
        last_error:
          type: string
